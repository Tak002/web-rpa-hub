# PR 마다 세트 검사. 비밀값이 필요 없고 PR 에 쓰기 권한도 없다.
# 필수 상태 검사 이름: lint
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 받기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # PR 이 tools/ 를 고쳐 검사를 약하게 만들 수 없도록, 바뀐 세트는 기준 브랜치(main)의 검사 도구로 검사한다.
      - name: 기준 브랜치의 검사 도구 꺼내기
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if git cat-file -e "origin/$BASE_REF:tools/hub.mjs" 2>/dev/null; then
            git archive "origin/$BASE_REF" tools | tar -x -C "$RUNNER_TEMP/base"
          else
            echo "기준 브랜치에 검사 도구가 없어 이 PR 의 도구를 씁니다."
            cp -r tools "$RUNNER_TEMP/base/"
          fi

      - name: 바뀐 세트 검사 (main 의 도구, 게시된 버전 보호·버전 증가 포함)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node "$RUNNER_TEMP/base/tools/hub.mjs" lint --base "origin/$BASE_REF"

      - name: 전체 세트 검사 (이 PR 의 도구)
        run: node tools/hub.mjs lint

      - name: 빌드 시험 (index.json 을 만들 수 있는지)
        run: |
          node tools/hub.mjs build --out "$RUNNER_TEMP/dist"
          node -e "const i=require(process.argv[1]);if(i.format!=='web-rpa-hub-index')process.exit(1);console.log('index.json 세트 '+i.sets.length+'개')" "$RUNNER_TEMP/dist/index.json"
