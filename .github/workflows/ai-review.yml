# PR 의 세트를 AI(OpenRouter)로 검토해 참고 댓글과 ai-* 라벨을 단다.
#
# 안전 규칙 (pull_request_target 은 쓰기 토큰과 비밀값을 가진 채 돈다):
#   - 기준 브랜치(main)만 checkout 하고, 실행하는 코드는 모두 main 의 tools/ 다.
#   - PR 내용은 `git fetch` 로 별도 ref 에 받아 git 객체에서 데이터로만 읽는다. 작업 폴더에 풀거나 실행하지 않는다.
#   - PR 의 코드·스크립트를 실행하지 않고 npm install 도 하지 않는다.
#   - PR 제목·본문 같은 사용자 입력을 셸 명령에 끼워 넣지 않는다.
#   - AI 는 댓글과 라벨만 단다. 병합·승인은 하지 않는다.
# OPENROUTER_API_KEY 비밀값이 없으면 "AI 검토 키가 설정되지 않아 건너뜀" 댓글만 단다.
name: ai-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'sets/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 기준 브랜치 받기 (PR 코드는 받지 않는다)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: PR 내용을 데이터로만 가져오기
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: AI 검토
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/ai-review.mjs --base HEAD --head refs/remotes/pr/head --pr "$PR_NUMBER" --post
