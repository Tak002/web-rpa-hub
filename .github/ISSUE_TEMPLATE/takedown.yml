name: 삭제 요청
description: 허브에서 세트를 내려 달라고 요청합니다 (권리 침해, 사이트 운영자 요청, 악성 의심 등).
title: "[삭제 요청] "
labels: ["삭제요청"]
body:
  - type: markdown
    attributes:
      value: |
        **세트에 개인정보가 들어 있다면 이 공개 이슈에 그 내용을 옮겨 적지 마세요.** 대신 [비공개 신고(Report a vulnerability)](https://github.com/Tak002/web-rpa-hub/security/advisories/new)로 세트 id 와 버전만 알려 주시면 관리자가 확인되는 대로 내립니다.
        처리 방법은 [허브 정책 11절](https://github.com/Tak002/web-rpa-hub/blob/main/POLICY.md#11-삭제-요청과-긴급-내리기)에 있습니다.
  - type: input
    id: set-id
    attributes:
      label: 세트 id 와 버전
      description: 모든 버전이면 "전체"라고 적어 주세요.
      placeholder: 예) someone/some-set 1.0.0
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: 이유
      options:
        - 악성 동작 또는 데이터 빼돌리기 의심
        - 저작권·이용약관 등 권리 침해
        - 사이트 운영자의 요청
        - 자동 접속을 금지하는 사이트
        - 기타
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 설명
      description: 어느 파일·스텝이 문제인지, 근거(약관 조항 링크 등)를 적어 주세요. 개인정보는 적지 마세요.
    validations:
      required: true
  - type: input
    id: relation
    attributes:
      label: 요청하는 분
      description: 예) 세트 작성자 본인, 사이트 운영자, 사용자
